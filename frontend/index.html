<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PollWave — Live Polling</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            colors: {
              primary: { DEFAULT: '#7C3AED', dark: '#6D28D9', light: '#A78BFA' },
              accent: { DEFAULT: '#10B981', dark: '#059669', light: '#34D399' },
              surface: {
                DEFAULT: '#0B0B0F',
                50: '#0F0F14',
                100: '#141419',
                200: '#161620',
                300: '#1C1C28',
                400: '#22222E',
                500: '#2A2A3A',
                600: '#35354A',
              },
            },
            keyframes: {
              barfill: { from: { width: '0%' }, to: {} },
              popin: {
                '0%': { transform: 'scale(0.96)', opacity: 0 },
                '100%': { transform: 'scale(1)', opacity: 1 },
              },
              fadeInUp: {
                '0%': { opacity: 0, transform: 'translateY(16px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              tabSwap: {
                '0%': { opacity: 0, transform: 'translateY(5px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              pageEnter: {
                '0%': { opacity: 0, transform: 'translateY(6px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              glowPulse: {
                '0%, 100%': { opacity: 0.3 },
                '50%': { opacity: 0.6 },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-6px)' },
              },
            },
            animation: {
              popin: 'popin 0.35s cubic-bezier(0.16, 1, 0.3, 1)',
              fadeInUp: 'fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              tabSwap: 'tabSwap 260ms cubic-bezier(0.22, 1, 0.36, 1) both',
              pageEnter: 'pageEnter 320ms cubic-bezier(0.22, 1, 0.36, 1) both',
              shimmer: 'shimmer 2s ease-in-out infinite',
              glowPulse: 'glowPulse 3s ease-in-out infinite',
              float: 'float 3s ease-in-out infinite',
            },
          },
        },
      }
    </script>
    <style>
      html, body, #root { height: 100%; }
      html { color-scheme: dark; }
      html.light-theme { color-scheme: light; }
      body {
        background:
          radial-gradient(circle at 88% -10%, rgba(124, 58, 237, 0.08), transparent 32rem),
          radial-gradient(circle at 8% 110%, rgba(16, 185, 129, 0.05), transparent 28rem),
          #0B0B0F;
        color: #F1F5F9;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }
      button, a, input, textarea { transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid rgba(167, 139, 250, 0.9);
        outline-offset: 3px;
      }

      /* --- Result bar animation --- */
      .bar-fill {
        transition: width 800ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* --- Gradient result bars --- */
      .bar-gradient-emerald {
        background: linear-gradient(90deg, #059669, #34d399);
      }
      .bar-gradient-violet {
        background: linear-gradient(90deg, #7c3aed, #a78bfa);
      }
      .bar-gradient-sky {
        background: linear-gradient(90deg, #0284c7, #38bdf8);
      }
      .bar-gradient-amber {
        background: linear-gradient(90deg, #d97706, #fbbf24);
      }
      .bar-gradient-rose {
        background: linear-gradient(90deg, #e11d48, #fb7185);
      }
      .bar-gradient-cyan {
        background: linear-gradient(90deg, #0891b2, #22d3ee);
      }

      /* --- Leading bar glow --- */
      .bar-leading {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.3), 0 0 6px rgba(16, 185, 129, 0.2);
      }

      /* --- Noise texture overlay --- */
      .noise-overlay::before {
        content: '';
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 256px 256px;
      }

      /* --- Ambient glow blobs --- */
      .glow-blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(120px);
        pointer-events: none;
        z-index: 0;
      }
      .glow-purple {
        background: radial-gradient(circle, rgba(124, 58, 237, 0.12) 0%, transparent 70%);
      }
      .glow-green {
        background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      }

      /* --- Dark card treatment --- */
      .card-dark {
        background: #161620;
        border: 1px solid #2A2A3A;
        border-radius: 16px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.02),
          0 2px 8px rgba(0, 0, 0, 0.3),
          0 8px 32px -4px rgba(0, 0, 0, 0.4);
        transition: box-shadow 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1), border-color 300ms ease;
      }
      .card-dark:hover {
        border-color: #35354A;
      }

      /* --- Interactive card with lift --- */
      .card-interactive {
        transition: box-shadow 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1), border-color 300ms ease;
      }
      .card-interactive:hover {
        transform: translateY(-2px);
        border-color: rgba(124, 58, 237, 0.3);
        box-shadow:
          0 0 0 1px rgba(124, 58, 237, 0.1),
          0 4px 12px rgba(0, 0, 0, 0.3),
          0 16px 48px -8px rgba(0, 0, 0, 0.4),
          0 0 40px -10px rgba(124, 58, 237, 0.15);
      }

      /* --- Gradient border highlight --- */
      .card-gradient-border {
        position: relative;
      }
      .card-gradient-border::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 17px;
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.3), rgba(16, 185, 129, 0.15), rgba(42, 42, 58, 0.5));
        z-index: -1;
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .card-gradient-border:hover::before {
        opacity: 1;
      }

      /* --- Top highlight line for cards --- */
      .card-highlight-top {
        position: relative;
      }
      .card-highlight-top::after {
        content: '';
        position: absolute;
        top: 0;
        left: 24px;
        right: 24px;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.4), transparent);
      }

      /* --- Skeleton loader (dark) --- */
      .skeleton {
        background: linear-gradient(90deg, #1C1C28 25%, #22222E 50%, #1C1C28 75%);
        background-size: 200% 100%;
        animation: shimmer 2s ease-in-out infinite;
        border-radius: 8px;
      }

      /* --- Dark header glass --- */
      .header-dark {
        background: rgba(11, 11, 15, 0.85);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-bottom: 1px solid rgba(42, 42, 58, 0.6);
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.02),
          0 4px 24px rgba(0, 0, 0, 0.3);
      }

      .back-button {
        color: #94A3B8;
        background: rgba(22, 22, 32, 0.72);
        border-color: #2A2A3A;
      }

      .back-button:hover {
        color: #E2E8F0;
        background: #22222E;
        border-color: #3E3E58;
      }

      /* --- Stagger delay utility --- */
      .delay-100 { animation-delay: 100ms; }
      .delay-200 { animation-delay: 200ms; }
      .delay-300 { animation-delay: 300ms; }
      .delay-400 { animation-delay: 400ms; }
      .delay-500 { animation-delay: 500ms; }

      /* --- Purple button glow --- */
      .btn-glow {
        box-shadow: 0 0 0 0 rgba(124, 58, 237, 0);
        transition: box-shadow 0.3s ease, background-color 0.2s ease, transform 0.2s ease;
      }
      .btn-glow:hover {
        box-shadow: 0 0 24px rgba(124, 58, 237, 0.3), 0 4px 16px rgba(124, 58, 237, 0.2);
      }
      .btn-glow:active {
        transform: scale(0.98);
      }

      /* --- Live indicator glow --- */
      .live-dot-glow {
        box-shadow: 0 0 8px rgba(16, 185, 129, 0.6), 0 0 20px rgba(16, 185, 129, 0.2);
      }

      /* --- Dark input focus ring --- */
      .input-dark {
        background: #0F0F14;
        border: 1px solid #2A2A3A;
        color: #E2E8F0;
        transition: all 0.2s ease;
      }
      .input-dark::placeholder {
        color: #4A4A5E;
      }
      .input-dark:focus {
        border-color: #7C3AED;
        box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15), 0 0 12px rgba(124, 58, 237, 0.1);
        background: #141419;
      }

      /* --- Fade-in section --- */
      .fade-in-section {
        opacity: 0;
        animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .page-content { animation: pageEnter 320ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      .tab-content-enter { animation: tabSwap 260ms cubic-bezier(0.22, 1, 0.36, 1) both; }

      /* --- Gentle dialog motion --- */
      @keyframes modalBackdropIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes modalSurfaceIn {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .modal-backdrop { animation: modalBackdropIn 220ms ease-out both; }
      .modal-surface { animation: modalSurfaceIn 320ms cubic-bezier(0.22, 1, 0.36, 1) both; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
        }
      }

      /* --- Status bar --- */
      .status-bar {
        background: rgba(11, 11, 15, 0.9);
        border-top: 1px solid #2A2A3A;
        backdrop-filter: blur(12px);
      }

      /* --- Mono label style --- */
      .mono-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: #64748B;
      }

      /* Light theme keeps the existing component structure while inverting its surfaces. */
      .light-theme body {
        background:
          linear-gradient(135deg, rgba(15, 23, 42, 0.03), transparent 45%),
          #F8FAFC;
        color: #1E293B;
      }

      .light-theme .min-h-screen.bg-\[\#0B0B0F\] { background-color: #F8FAFC !important; color: #1E293B !important; }
      .light-theme .header-dark { background: rgba(255, 255, 255, 0.88); border-bottom-color: #E2E8F0; box-shadow: 0 4px 24px rgba(15, 23, 42, 0.08); }
      .light-theme .back-button { color: #64748B; background: rgba(255, 255, 255, 0.82); border-color: #CBD5E1; }
      .light-theme .back-button:hover { color: #1E293B; background: #F1F5F9; border-color: #94A3B8; }
      .light-theme .glow-purple,
      .light-theme .glow-green { display: none; }
      .light-theme .theme-toggle { background: #FFFFFF; border-color: #CBD5E1; color: #475569; }
      .light-theme .profile-icon { filter: grayscale(1) brightness(0) invert(1); }
      .light-theme .quick-launch-bar {
        background: rgba(255, 255, 255, 0.96) !important;
        border: 1px solid #111827 !important;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1) !important;
      }
      .light-theme .quick-launch-action {
        background: #FFFFFF !important;
        border: 1px solid #111827 !important;
        color: #111827 !important;
        box-shadow: none !important;
      }
      .light-theme .quick-launch-action:hover { background: #F1F5F9 !important; }
      .light-theme .quick-launch-icon { color: #111827 !important; }
      .light-theme .vote-mode-badge {
        background: #FFFFFF !important;
        border-color: #111827 !important;
        color: #111827 !important;
      }
      .light-theme .vote-option.is-selected {
        background: #FFFFFF !important;
        border-color: #111827 !important;
        box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12) !important;
        --tw-ring-color: #111827 !important;
      }
      .light-theme .vote-option.is-selected .vote-option-letter {
        background: #111827 !important;
        border-color: #111827 !important;
        color: #FFFFFF !important;
        box-shadow: none !important;
      }
      .light-theme .vote-option.is-selected .vote-option-radio {
        background: #FFFFFF !important;
        border-color: #111827 !important;
      }
      .light-theme .vote-option.is-selected .vote-option-radio > div { background: #111827 !important; }
      .light-theme .voter-avatar {
        background: #111827 !important;
        border: 1px solid #111827;
        color: #FFFFFF !important;
        --tw-ring-color: #F8FAFC !important;
      }
      .light-theme .voter-avatar-jd {
        background: #111827 !important;
        border-color: #111827 !important;
        color: #FFFFFF !important;
      }
      .light-theme .voter-avatar-mk {
        background: #111827 !important;
        border-color: #111827 !important;
        color: #FFFFFF !important;
      }
      .light-theme .voter-avatar-more {
        background: #111827 !important;
        border-color: #111827 !important;
        color: #FFFFFF !important;
      }
      .light-theme [class*="bg-[#14141C]"],
      .light-theme [class*="bg-[#141419]"],
      .light-theme [class*="bg-[#161620]"],
      .light-theme [class*="bg-[#12121A]"],
      .light-theme [class*="bg-[#0C0C12]"],
      .light-theme [class*="bg-[#0F0F16]"],
      .light-theme [class*="bg-[#0F0F17]"],
      .light-theme [class*="bg-[#0D0D14]"],
      .light-theme [class*="bg-[#1B1B26]"],
      .light-theme [class*="bg-[#1C1C28]"],
      .light-theme [class*="bg-[#22222E]"],
      .light-theme [class*="bg-[#181824]"],
      .light-theme [class*="bg-[#1D1D2B]"],
      .light-theme [class*="bg-[#1E1E2C]"],
      .light-theme [class*="bg-[#1A1A26]"],
      .light-theme [class*="bg-[#14141E]"] { background-color: #FFFFFF !important; }
      .light-theme [class*="border-[#2A2A3A]"],
      .light-theme [class*="border-[#252536]"],
      .light-theme [class*="border-[#222230]"],
      .light-theme [class*="border-[#242434]"],
      .light-theme [class*="border-[#242436]"],
      .light-theme [class*="border-[#232334]"],
      .light-theme [class*="border-[#2B2B3E]"],
      .light-theme [class*="border-[#2E2E42]"],
      .light-theme [class*="border-[#2D2D42]"] { border-color: #CBD5E1 !important; }
      .light-theme [class~="text-white"] { color: #0F172A !important; }
      .light-theme [class*="text-slate-200"],
      .light-theme [class*="text-slate-300"] { color: #334155 !important; }
      .light-theme [class*="text-slate-400"],
      .light-theme [class*="text-slate-500"],
      .light-theme [class*="text-slate-600"] { color: #64748B !important; }
      .light-theme [class*="bg-purple-"],

      .light-theme [class*="bg-[#C4B5FD]"],
      .light-theme [class*="hover:bg-[#DDD6FE]"]:hover { background-color: #111827 !important; color: #FFFFFF !important; }
      .light-theme [class*="text-[#161026]"] { color: #FFFFFF !important; }
      .light-theme [class*="border-[#161026]"] { border-color: #FFFFFF !important; }
      .light-theme [class*="bg-emerald-"] { background-color: #F1F5F9 !important; }
      .light-theme [class*="text-purple-"],

      .light-theme [class*="ring-purple-"],

      .light-theme [class*="shadow-purple-"] { --tw-shadow-color: rgba(15, 23, 42, 0.16) !important; }
      .light-theme .btn-glow:hover { box-shadow: 0 8px 20px rgba(15, 23, 42, 0.16); }
      .light-theme .voter-avatar,
      .light-theme .voter-avatar-jd,
      .light-theme .voter-avatar-mk,
      .light-theme .voter-avatar-more {

      }
      .light-theme .dashboard-live-dot {
